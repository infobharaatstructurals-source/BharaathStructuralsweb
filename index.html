      * {
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      /* Allow typing and selecting text inside form fields */
      input,
      textarea,
      select {
        user-select: text;
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
      }

      /* Prevent image dragging */
      img {
        -webkit-user-drag: none;
        user-drag: none;
      }
